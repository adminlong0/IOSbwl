name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-ios-ipa:
    name: Build unsigned IPA
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build native iOS app without signing
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild \
            -project ios/Runner.xcodeproj \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build/xcodebuild.log || BUILD_STATUS=$?
          if [ "${BUILD_STATUS:-0}" -ne 0 ]; then
            sed -E $'s/\x1B\[[0-9;]*[mK]//g' build/xcodebuild.log > build/xcodebuild-clean.log
            grep -iE "error|failed|embedded binary|multiple commands|validateembeddedbinary" build/xcodebuild-clean.log | tail -n 20 | while IFS= read -r line; do
              line=${line//'%'/'%25'}
              line=${line//$'\r'/'%0D'}
              line=${line//$'\n'/'%0A'}
              echo "::error title=Xcode build failure::$line"
            done || true
            {
              echo '### Xcode diagnostic'
              echo '```text'
              tail -n 180 build/xcodebuild-clean.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit "$BUILD_STATUS"
          fi

      - name: Package unsigned IPA
        run: |
          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/NLBUS.app"
          test -d "$APP_PATH"
          mkdir -p build/ios/ipa/Payload
          cp -R "$APP_PATH" build/ios/ipa/Payload/NLBUS.app
          cd build/ios/ipa
          zip -qry NLBUS-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: nlbus-unsigned-ipa
          path: build/ios/ipa/NLBUS-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
